general {
    no_fade_in = false
}

background {
    monitor =
    color = rgba(0, 0, 0, 1)
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(ff0055)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgb(ff0055)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    
    # Sharp corners
    rounding = 1                # Set to 0 for a sharp rectangle
    
    # Square dots
    dots_size = 0.3              # Size of the squares
    dots_spacing = 0.2           # Space between squares
    dots_center = true
    dots_rounding = 0            # Set to 0 to make the dots into squares
    
    outer_color = rgb(ff0055)    # Pink border
    inner_color = rgb(000000)    # Black input background
    font_color = rgb(ff0055)     # Pink text (for placeholder/caps lock)
    
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    
    position = 0, -80
    halign = center
    valign = center
}
